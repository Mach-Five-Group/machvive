<style>
     
    html, body {
        overflow-x: hidden;
        position: relative;
    }
    
    .main-nav {
        position: relative;
    }
    
    .nav-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 70px;
        position: relative;
    }
    
     
    .nav-brand {
        flex-shrink: 0;
    }
    
    .brand-link {
        display: block;
        text-decoration: none;
    }
    
    .nav-logo {
        height: 40px;
        width: auto;
    }
    
     
    .desktop-nav {
        display: flex;
        align-items: center;
        gap: 30px;
    }
    
    .nav-link {
        color: #fff;
        text-decoration: none;
        font-size: 16px;
        font-weight: 400;
        transition: color 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .nav-link:hover {
        color: #DD4124;
    }
    
    .github-link svg {
        width: 20px;
        height: 20px;
    }
    
     
    .mobile-menu-btn {
        display: none;
        flex-direction: column;
        justify-content: center;
        width: 30px;
        height: 30px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        position: relative;
        z-index: 1001;  
    }
    
    .hamburger-line {
        width: 25px;
        height: 3px;
        background-color: #fff;
        margin: 3px 0;
        transition: all 0.3s ease;
        transform-origin: center;
    }
    
     
    .mobile-menu-btn.active .hamburger-line:nth-child(1) {
        transform: rotate(45deg) translate(6px, 6px);
    }
    
    .mobile-menu-btn.active .hamburger-line:nth-child(2) {
        opacity: 0;
    }
    
    .mobile-menu-btn.active .hamburger-line:nth-child(3) {
        transform: rotate(-45deg) translate(6px, -6px);
    }
    
     
    .mobile-nav-drawer {
        position: fixed;
        top: 0;
        right: -280px;
        width: 280px;
        height: 100vh;
        background-color: #1a1a1a;
        border-left: 1px solid #333;
        transition: right 0.3s ease;
        z-index: 999;
        transform: translateZ(0);
         
        overflow-y: auto;
        overflow-x: hidden;
         
        padding-top: 70px;
    }
    
    .mobile-nav-drawer.open {
        right: 0;
    }
    
    .mobile-nav-content {
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        gap: 25px;
    }
    
    .mobile-nav-link {
        color: #fff;
        text-decoration: none;
        font-size: 18px;
        font-weight: 400;
        padding: 15px 0;
        border-bottom: 1px solid #333;
        transition: color 0.3s ease;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    
    .mobile-nav-link:hover {
        color: #DD4124;
    }
    
    .github-mobile svg {
        width: 20px;
        height: 20px;
    }
    
     
    @media (max-width: 768px) {
        .desktop-nav {
            display: none;
        }
        
        .mobile-menu-btn {
            display: flex;
        }
        
         
        body {
            overflow-x: hidden;
        }
        
        .l-main__header {
            overflow: visible;
        }
        
         
        .main-nav {
            overflow: hidden;
        }
        
         
        .nav-container {
            padding: 0 15px;
        }
        
        .nav-brand {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        
        .mobile-menu-btn {
            margin-left: auto;
        }
        
         
        html {
            overflow-x: hidden !important;
            width: 100%;
        }
        
        body {
            overflow-x: hidden !important;
            width: 100%;
            position: relative;
        }
        
         
        .mobile-nav-drawer {
            visibility: hidden;
        }
        
        .mobile-nav-drawer.open {
            visibility: visible;
        }
    }
    
     
    @media (min-width: 769px) {
        .mobile-nav-drawer {
            display: none !important;
        }
        
        .mobile-nav-overlay {
            display: none !important;
        }
    }
    
     
    .mobile-nav-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.5);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        z-index: 998;
    }
    
    .mobile-nav-overlay.active {
        opacity: 1;
        visibility: visible;
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
    const mobileNavDrawer = document.querySelector('.mobile-nav-drawer');
    const body = document.body;
    
    
    const overlay = document.createElement('div');
    overlay.className = 'mobile-nav-overlay';
    body.appendChild(overlay);
    
    function toggleMobileMenu() {
        mobileMenuBtn.classList.toggle('active');
        mobileNavDrawer.classList.toggle('open');
        overlay.classList.toggle('active');
        body.style.overflow = mobileNavDrawer.classList.contains('open') ? 'hidden' : '';
    }
    
    mobileMenuBtn.addEventListener('click', toggleMobileMenu);
    overlay.addEventListener('click', toggleMobileMenu);
    
    
    const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');
    mobileNavLinks.forEach(link => {
        link.addEventListener('click', () => {
            if (mobileNavDrawer.classList.contains('open')) {
                toggleMobileMenu();
            }
        });
    });
});
</script>
